name: Build Lal Khata APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglu1-mesa

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet
          pip install -r requirements.txt

      - name: Build Android APK
        run: |
          printf 'y\n' | flet build apk src --target-platform android-arm64 --split-per-abi=false -vv
        run: |
          printf 'y\n' | flet build apk src --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lal-Khata-Pro-APK
          path: "**/build/apk/*.apk"
          
